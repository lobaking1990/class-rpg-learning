<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pengembaraan Pembelajaran RPG — Preview</title>
<style>
:root{--gold:#d8aa43;--ink:#2b1c0f;--paper:#fff8df;--line:#7a5520;--green:#2f9b43;--blue:#2c70c9;--red:#c43e45;--purple:#7243a4}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,"Microsoft YaHei",serif;color:var(--ink);background:#1c2430}button,input,select{font:inherit}.screen{display:none;min-height:100vh;padding:18px;background-size:cover;background-position:center}.screen.active{display:block}.opening{background:radial-gradient(circle at 50% 28%,#f8eab1 0 9%,transparent 10%),linear-gradient(#76c8ff 0 38%,#7bd4b0 38% 55%,#2f6b47 55% 100%)}.hub{background:linear-gradient(145deg,#78c8ff,#d7efff 35%,#5b9d72 36%,#37694e 100%)}.m1{background:linear-gradient(135deg,#8ad8ff,#fff2c5 48%,#4f8c6a)}.m2{background:linear-gradient(135deg,#314a62,#77b4d2 45%,#6e8360)}.m3{background:linear-gradient(135deg,#293b55,#7860a5 55%,#1d2531)}.m4{background:linear-gradient(135deg,#d9c9ff,#fff0b6 50%,#75b4a2)}.boss{background:radial-gradient(circle at 50% 20%,#b14a61,#4d244e 48%,#16131f 100%)}
.panel,.card,.modalbox{background:linear-gradient(rgba(255,251,235,.97),rgba(244,224,180,.96));border:3px solid var(--line);border-radius:20px;box-shadow:0 10px 24px #0005}.panel{padding:20px}.wrap{max-width:1080px;margin:auto}.center{text-align:center}.zh{display:block;font-family:"Microsoft YaHei",sans-serif;font-size:.82em;color:#6a543d;margin-top:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}.btn{border:2px solid #684313;border-radius:14px;padding:11px 16px;font-weight:900;box-shadow:0 4px 0 #664013;cursor:pointer}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #664013}.primary{background:linear-gradient(#62ce6b,#329844);color:#fff}.secondary{background:linear-gradient(#ffd86f,#d99b2a)}.ghost{background:#fff9e9}.teacher{background:linear-gradient(#415b87,#243554);color:#fff}.danger{background:#d45555;color:#fff}
.intro{max-width:880px;margin:4vh auto}.intro h1{font-size:clamp(30px,5vw,55px);margin:0 0 10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:2px solid #936a2c;border-radius:12px;background:#fff}.jobs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.job{padding:12px;border:3px solid #9c742d;border-radius:16px;background:#fff9e9;font-weight:900;cursor:pointer}.job.sel{outline:4px solid #2c79d5;background:#eaf4ff}.job i{display:block;font-style:normal;font-size:40px}
.top{max-width:1160px;margin:0 auto 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand,.status{background:#fff5d7ee;border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:900}.status{font-size:14px}.hero{display:flex;align-items:center;gap:14px}.avatar{width:110px;height:110px;border:3px solid #9a702f;border-radius:18px;display:grid;place-items:center;font-size:64px;background:#fffaf0}.bar{height:16px;background:#30251a;border:2px solid #6c491c;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#49ba58,#e9ea61);width:0}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.mode{min-height:150px;display:flex;align-items:center;gap:15px;text-align:left;padding:15px;border:3px solid var(--line);border-radius:20px;background:linear-gradient(#fff8e9,#ecd59f);cursor:pointer}.mode .ico{width:76px;height:76px;display:grid;place-items:center;border-radius:20px;border:3px solid #a6782e;background:#fff7d8;font-size:43px}.mode strong{font-size:23px}.mode.bossbtn{grid-column:1/-1;background:linear-gradient(#ffe9e5,#efc0b8)}
.question{font-size:clamp(21px,3vw,30px);font-weight:900;padding:14px;border:2px solid #9e7431;border-radius:15px;background:#fffaf0ee;text-align:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.ans{min-height:130px;padding:16px;border:3px solid #805820;border-radius:18px;background:linear-gradient(#fffdf5,#f0d9a3);font-size:24px;font-weight:900;cursor:pointer}.ans.ok{background:#dff8d9;border-color:#2c8b48}.ans.bad{background:#ffdede;border-color:#b9363f}.feedback{padding:12px;border:2px solid #876129;border-radius:13px;background:#fff8df;text-align:center;font-weight:900;margin:12px 0}.match{display:grid;grid-template-columns:1fr 50px 1fr;gap:10px;margin:15px 0}.col{display:grid;gap:10px}.node{padding:12px;border:3px solid #805820;border-radius:14px;background:#fff8e2;font-weight:900;cursor:pointer}.node.sel{outline:4px solid #2f7bd1}.node.done{background:#e0f8dc;opacity:.7}.mid{display:grid;place-items:center;font-size:30px}.hp span{background:linear-gradient(90deg,#ef7079,#c53541)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#0009;padding:18px;place-items:center}.modal.open{display:grid}.modalbox{width:min(680px,100%);padding:20px}.rows{display:grid;gap:7px;margin-top:12px}.row{display:grid;grid-template-columns:45px 1fr 110px;gap:8px;padding:9px;border-bottom:1px solid #b89155}.teachergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tool{min-height:110px;border:3px solid #8b6325;border-radius:17px;background:#fff7df;font-weight:900;font-size:18px}.hidden{display:none!important}
@media(max-width:720px){.form,.modegrid,.answers,.teachergrid{grid-template-columns:1fr}.jobs{grid-template-columns:repeat(2,1fr)}.mode.bossbtn{grid-column:auto}.match{grid-template-columns:1fr 25px 1fr}.hero{align-items:flex-start}.avatar{width:88px;height:88px;font-size:50px}}
</style>
</head>
<body>
<section id="start" class="screen opening active"><div class="intro panel center">
<h1>Pengembaraan Pembelajaran RPG<span class="zh">学习冒险 RPG</span></h1>
<p>GitHub Preview · Bahasa Melayu<span class="zh">GitHub 预览版 · 马来文学习冒险</span></p>
<div class="form">
<div class="field"><label>Nama Murid<span class="zh">学生姓名</span></label><input id="name" placeholder="Contoh: Jia Wei"></div>
<div class="field"><label>Kelas<span class="zh">班级</span></label><input id="kelas" placeholder="Contoh: 4M"></div>
<div class="field"><label>Kod Murid<span class="zh">学生代码</span></label><input id="code" placeholder="0123"></div>
<div class="field"><label>Jantina Avatar<span class="zh">角色性别</span></label><select id="gender"><option>Lelaki / 男</option><option>Perempuan / 女</option></select></div>
</div>
<div class="jobs" id="jobs"></div>
<div class="actions"><button class="btn secondary" id="startHall">🏆 Hall of Fame / 英雄排行榜</button><button class="btn primary" id="enter">Masuk Dunia RPG / 进入冒险世界</button></div>
</div></section>

<section id="hub" class="screen hub"><div class="top"><div class="brand">Pusat Latihan Wira<span class="zh">英雄训练营</span></div><div class="status" id="status"></div></div><div class="wrap">
<div class="panel hero"><div class="avatar" id="avatar">⚔️</div><div style="flex:1"><h2 id="heroName" style="margin:0">Wira</h2><div id="heroLine">Warrior · Stage 1</div><div style="margin-top:8px;font-weight:900">EXP Global <span id="xpText">0 / 100</span></div><div class="bar"><span id="xp"></span></div></div></div>
<div class="modegrid">
<button class="mode" data-mode="m1"><span class="ico">🃏</span><span><strong>Pilih Kad</strong><span class="zh">选择卡片 · pilih 1 daripada 2 jawapan</span></span></button>
<button class="mode" data-mode="m2"><span class="ico">⚔️</span><span><strong>Pertarungan</strong><span class="zh">战斗模式 · serang jawapan yang betul</span></span></button>
<button class="mode" data-mode="m3"><span class="ico">🧩</span><span><strong>Teka-teki</strong><span class="zh">解谜模式 · buka rune dan pintu</span></span></button>
<button class="mode" data-mode="m4"><span class="ico">📚</span><span><strong>Padankan Maksud</strong><span class="zh">词义配对 · BM ↔ 中文</span></span></button>
<button class="mode bossbtn" data-mode="boss"><span class="ico">👹</span><span><strong>Pertarungan Boss</strong><span class="zh">Boss 战 · campuran keempat-empat mod</span></span></button>
</div>
<div class="actions"><button class="btn secondary" id="hall">🏆 Hall of Fame / 英雄排行榜</button><button class="btn teacher" id="teacher">🔐 Mod Guru / 教师模式</button></div>
</div></section>

<section id="m1" class="screen m1"></section>
<section id="m2" class="screen m2"></section>
<section id="m3" class="screen m3"></section>
<section id="m4" class="screen m4"></section>
<section id="boss" class="screen boss"></section>

<div class="modal" id="hallModal"><div class="modalbox"><h2>🏆 Hall of Fame <span class="zh">英雄排行榜</span></h2><div class="rows" id="leaderRows"></div><div class="actions"><button class="btn primary" data-close="hallModal">Tutup</button></div></div></div>
<div class="modal" id="teacherModal"><div class="modalbox"><div id="teacherLogin"><h2>🔐 Mod Guru <span class="zh">教师模式</span></h2><div class="field"><label>Kata Laluan Guru<span class="zh">教师密码</span></label><input id="pass" type="password" maxlength="12" placeholder="••••"></div><div id="passMsg" class="feedback">Masukkan kata laluan.</div><div class="actions"><button class="btn primary" id="unlock">Buka Mod Guru / 开启教师模式</button><button class="btn ghost" data-close="teacherModal">Tutup</button></div></div><div id="teacherTools" class="hidden"><h2>Mod Guru Aktif <span class="zh">教师模式已开启</span></h2><div class="teachergrid"><button class="tool" id="sync">☁️<br>Sync Sekarang<span class="zh">立即同步</span></button><button class="tool" id="switch">🔄<br>Tukar Murid<span class="zh">更换学生</span></button></div><div class="actions"><button class="btn danger" id="lock">🔒 Kunci Mod Guru</button></div></div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const jobs=[['Warrior','⚔️','战士'],['Archer','🏹','弓手'],['Thief','🗡️','盗贼'],['Mage','🔮','法师'],['Priest','✨','牧师']];
const questions=[
['Pilih kata kerja yang betul.','membaca','cantik'],['Pilih kata nama yang betul.','sekolah','berlari'],['Ayat manakah betul?','Saya pergi ke sekolah.','Saya ke pergi sekolah.'],['Pilih kata adjektif.','rajin','menulis'],['Pilih kata sendi nama.','di','dan'],['Pilih kata hubung.','kerana','meja'],['Pilih perkataan berimbuhan.','bermain','bola'],['Pilih penjodoh bilangan sesuai untuk buku.','buah','ekor'],['Pilih ejaan yang betul.','aktiviti','aktivety'],['Pilih ayat sopan.','Bolehkah saya membantu?','Hei, ke sini!']
];
const pairs=[['rajin','勤劳'],['bersih','干净'],['gembira','开心'],['membantu','帮助']];
let state={name:'Wira',kelas:'',job:'Warrior',exp:0,combo:0,best:0,correct:0,wrong:0},selectedJob='Warrior',bossHP=5,selectedBM=null,matched=new Set();
function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');scrollTo(0,0);render()}
function stage(){return state.exp>=1000?5:state.exp>=600?4:state.exp>=300?3:state.exp>=100?2:1}
function next(){return [0,100,300,600,1000][stage()]||1000}
function pct(){const s=stage(); if(s===5)return 100; const a=[0,100,300,600,1000][s-1],b=next(); return Math.max(0,Math.min(100,(state.exp-a)/(b-a)*100))}
function render(){state.best=Math.max(state.best,state.combo);$('#status').textContent='EXP '+state.exp+' · Stage '+stage()+' · 🔥 x'+state.combo;$('#heroName').textContent=state.name;$('#heroLine').textContent=state.job+' · Stage '+stage()+' · Best Combo '+state.best;$('#avatar').textContent=(jobs.find(j=>j[0]===state.job)||jobs[0])[1];$('#xp').style.width=pct()+'%';$('#xpText').textContent=stage()===5?state.exp+' · MAX':state.exp+' / '+next()}
function award(){state.combo++;state.best=Math.max(state.best,state.combo);let b=state.combo===3?10:state.combo===5?25:state.combo===10?60:0;state.exp+=25+b;state.correct++;save();return 25+b}
function fail(){state.combo=0;state.wrong++;save()}
function save(){localStorage.setItem('rpgPreview',JSON.stringify(state));render()}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('rpgPreview')||'{}'))}catch(e){}}
function buildJobs(){const w=$('#jobs');jobs.forEach(j=>{let b=document.createElement('button');b.className='job'+(j[0]===selectedJob?' sel':'');b.innerHTML='<i>'+j[1]+'</i>'+j[0]+'<span class="zh">'+j[2]+'</span>';b.onclick=()=>{selectedJob=j[0];w.innerHTML='';buildJobs()};w.appendChild(b)})}
function shell(id,title,zh){$('#'+id).innerHTML='<div class="top"><div class="brand">'+title+'<span class="zh">'+zh+'</span></div><div class="status">EXP '+state.exp+' · 🔥 x'+state.combo+'</div></div><div class="wrap panel center"><div id="'+id+'body"></div><div class="actions"><button class="btn primary" onclick="show(\'hub\')">Pusat Latihan / 训练营</button></div></div>'}
function modeChoice(id,title,zh,three=false){shell(id,title,zh);let q=questions[Math.floor(Math.random()*questions.length)],opts=[q[1],q[2]];if(three)opts.push(['sangat','kerusi','kepada','cantik'][Math.floor(Math.random()*4)]);opts=opts.sort(()=>Math.random()-.5);let body=$('#'+id+'body');body.innerHTML='<div class="question">'+q[0]+'</div><div class="answers" id="opts"></div><div class="feedback" id="fb">Pilih jawapan yang betul.</div>';opts.forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>{let ok=v===q[1];b.classList.add(ok?'ok':'bad');$('#opts').querySelectorAll('button').forEach(x=>x.disabled=true);$('#fb').innerHTML=ok?'✅ Betul! +'+award()+' EXP':'❌ Jawapan: <b>'+q[1]+'</b>';if(!ok)fail()};$('#opts').appendChild(b)})}
function modeMatch(){shell('m4','Mode 4: Padankan Maksud','模式四：词义配对');selectedBM=null;matched=new Set();let left=[...pairs].sort(()=>Math.random()-.5),right=[...pairs].sort(()=>Math.random()-.5);let body=$('#m4body');body.innerHTML='<div class="question">Padankan BM dengan maksud 中文.</div><div class="match"><div class="col" id="bm"></div><div class="mid">↔</div><div class="col" id="zh"></div></div><div class="feedback" id="mfb">Pilih BM dahulu.</div>';left.forEach(p=>{let b=document.createElement('button');b.className='node';b.textContent=p[0];b.onclick=()=>{if(matched.has(p[0]))return;$('#bm').querySelectorAll('button').forEach(x=>x.classList.remove('sel'));selectedBM=p[0];b.classList.add('sel')};$('#bm').appendChild(b)});right.forEach(p=>{let b=document.createElement('button');b.className='node';b.textContent=p[1];b.onclick=()=>{if(!selectedBM)return;let t=pairs.find(x=>x[0]===selectedBM);if(t&&t[1]===p[1]){matched.add(selectedBM);b.classList.add('done');let bm=[...$('#bm').children].find(x=>x.textContent===selectedBM);bm.classList.add('done');selectedBM=null;if(matched.size===pairs.length){$('#mfb').textContent='✅ Semua betul! +'+award()+' EXP'}}else{fail();selectedBM=null;$('#mfb').textContent='❌ Cuba lagi.'}};$('#zh').appendChild(b)})}
function modeBoss(){shell('boss','Pertarungan Boss','Boss 战');let body=$('#bossbody');let q=questions[Math.floor(Math.random()*questions.length)],opts=[q[1],q[2]].sort(()=>Math.random()-.5);body.innerHTML='<div style="font-size:70px">👹</div><div class="bar hp"><span id="hp" style="width:'+(bossHP*20)+'%"></span></div><h3>'+bossHP+' / 5 HP</h3><div class="question">'+q[0]+'</div><div class="answers" id="bopts"></div><div class="feedback" id="bfb">Jawab betul untuk menyerang Boss.</div>';opts.forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>{let ok=v===q[1];$('#bopts').querySelectorAll('button').forEach(x=>x.disabled=true);if(ok){award();bossHP--;$('#bfb').textContent='⚔️ Serangan berjaya!';if(bossHP<=0){state.exp+=100;save();bossHP=5;setTimeout(()=>{alert('🏆 Boss ditewaskan! +100 EXP');show('hub')},250)}else setTimeout(modeBoss,500)}else{fail();$('#bfb').textContent='💥 Serangan tersasar.'}};$('#bopts').appendChild(b)})}
function openHall(){let rows=$('#leaderRows');let list=JSON.parse(localStorage.getItem('rpgLeaders')||'[]');let me={name:state.name,kelas:state.kelas,exp:state.exp,stage:stage()};list=list.filter(x=>!(x.name===me.name&&x.kelas===me.kelas));list.push(me);list.sort((a,b)=>b.exp-a.exp);localStorage.setItem('rpgLeaders',JSON.stringify(list.slice(0,20)));rows.innerHTML=list.slice(0,20).map((x,i)=>'<div class="row"><b>#'+(i+1)+'</b><span>'+x.name+'<span class="zh">'+x.kelas+'</span></span><b>'+x.exp+' EXP</b></div>').join('');$('#hallModal').classList.add('open')}
load();buildJobs();render();
$('#enter').onclick=()=>{state.name=$('#name').value.trim()||'Wira';state.kelas=$('#kelas').value.trim();state.job=selectedJob;save();show('hub')};
$$('[data-mode]').forEach(b=>b.onclick=()=>{let m=b.dataset.mode;show(m);if(m==='m1')modeChoice('m1','Mode 1: Pilih Kad','模式一：选择卡片');if(m==='m2')modeChoice('m2','Mode 2: Pertarungan','模式二：战斗',true);if(m==='m3')modeChoice('m3','Mode 3: Teka-teki','模式三：解谜',true);if(m==='m4')modeMatch();if(m==='boss')modeBoss()});
$('#hall').onclick=openHall;$('#startHall').onclick=openHall;$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));
$('#teacher').onclick=()=>{$('#teacherModal').classList.add('open');$('#teacherLogin').classList.remove('hidden');$('#teacherTools').classList.add('hidden');$('#pass').value=''};
$('#unlock').onclick=()=>{if($('#pass').value==='1234'){$('#teacherLogin').classList.add('hidden');$('#teacherTools').classList.remove('hidden')}else $('#passMsg').textContent='❌ Kata laluan tidak betul / 密码错误'};
$('#lock').onclick=()=>{$('#teacherLogin').classList.remove('hidden');$('#teacherTools').classList.add('hidden');$('#pass').value=''};
$('#sync').onclick=()=>alert('Preview GitHub: Cloud belum disambungkan lagi.');
$('#switch').onclick=()=>{$('#teacherModal').classList.remove('open');show('start')};
</script>
</body></html>
